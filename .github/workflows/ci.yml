name: CI

on:
  push:
  pull_request:

jobs:
  web-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

  ml-service:
    # NOTE: below, the ml-service job installs system ffmpeg — torchaudio.load()
    # delegates to TorchCodec, which requires FFmpeg's shared libraries at
    # runtime (same reason ml-service/Dockerfile installs it), not just at
    # test-fixture generation time (that's imageio-ffmpeg, a separate,
    # portable binary already covered by pip install -e ".[dev]").
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest
