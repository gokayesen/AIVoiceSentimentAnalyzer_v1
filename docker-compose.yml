services:
  web-api:
    build:
      context: ./web-api
    ports:
      - "8000:8000"
    environment:
      - STORAGE_DIR=/storage
      - DB_PATH=/storage/app.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./storage:/storage
    depends_on:
      - redis

  # Functional as of Story 2.1 (frontend build/serve pipeline, AD-18).
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"

  # Functional as of Story 1.2 (async orchestration, AD-13).
  redis:
    image: redis:8.10

  # Functional as of Story 1.2 (ingest stage), extended through Story 1.6
  # (ingest/acoustic/transcript/text-sentiment/fusion — consolidated
  # ML/audio service, AD-7).
  ml-service:
    build:
      context: ./ml-service
    environment:
      - STORAGE_DIR=/storage
      - DB_PATH=/storage/app.db
      - REDIS_URL=redis://redis:6379/0
      # Story 3.2 (AD-6): required for mono-path diarization (pyannote's
      # Community-1 pipeline is HF-gated) — passthrough from the host/
      # deployment environment, never hardcoded here. Defaults to empty
      # (code review, 2026-08-17) so `docker compose` invocations by anyone
      # not working on diarization don't print Compose's "variable is not
      # set" warning; an empty/unset value degrades to a per-Call
      # diarization failure (AD-1), never a compose-level error.
      - HF_TOKEN=${HF_TOKEN:-}
    depends_on:
      - redis
    volumes:
      - ./storage:/storage
